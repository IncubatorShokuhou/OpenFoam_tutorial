<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <style>
    .box{rx:18;stroke:#24445c;stroke-width:3}.t{font:700 25px sans-serif;fill:#173042}.s{font:18px sans-serif;fill:#173042}.a{stroke:#e76f51;stroke-width:5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e76f51"/></marker></defs>
  <rect width="1200" height="360" fill="#f7fafc"/>
  <rect class="box" x="35" y="85" width="190" height="160" fill="#dff3e4"/><text class="t" x="130" y="130" text-anchor="middle">现实问题</text><text class="s" x="130" y="170" text-anchor="middle">盒子多大？</text><text class="s" x="130" y="200" text-anchor="middle">壁面怎样动？</text>
  <rect class="box" x="275" y="85" width="190" height="160" fill="#dceefe"/><text class="t" x="370" y="130" text-anchor="middle">网格</text><text class="s" x="370" y="170" text-anchor="middle">blockMesh</text><text class="s" x="370" y="200" text-anchor="middle">400 个小盒子</text>
  <rect class="box" x="515" y="85" width="190" height="160" fill="#fff0cf"/><text class="t" x="610" y="130" text-anchor="middle">方程与算法</text><text class="s" x="610" y="170" text-anchor="middle">foamRun</text><text class="s" x="610" y="200" text-anchor="middle">逐时间步求 U、p</text>
  <rect class="box" x="755" y="85" width="190" height="160" fill="#eadffc"/><text class="t" x="850" y="130" text-anchor="middle">数值结果</text><text class="s" x="850" y="170" text-anchor="middle">时间目录</text><text class="s" x="850" y="200" text-anchor="middle">0.5/ 1/ … 10/</text>
  <rect class="box" x="995" y="85" width="170" height="160" fill="#fde1df"/><text class="t" x="1080" y="130" text-anchor="middle">看图解释</text><text class="s" x="1080" y="170" text-anchor="middle">VTK / ParaView</text><text class="s" x="1080" y="200" text-anchor="middle">速度、压力、涡</text>
  <path class="a" d="M225 165 H270"/><path class="a" d="M465 165 H510"/><path class="a" d="M705 165 H750"/><path class="a" d="M945 165 H990"/>
  <text class="s" x="600" y="310" text-anchor="middle">验证不是“图好看”：每一步都要检查尺寸、单位、边界、网格质量和守恒</text>
</svg>
